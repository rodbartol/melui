<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Themes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&family=Shippori+Mincho:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="../src/index.css" />
    <link rel="stylesheet" href="../src/themes/japan-fish.css" />
    <link rel="stylesheet" href="../src/themes/mono.css" />
    <link rel="stylesheet" href="../src/themes/loud.css" />
    <style>
      /* Demo page styles only: layout of the four screens. Every look inside a screen comes
         from Melui and its theme, which only sets tokens. */
      body {
        max-width: 84rem;
        margin-inline: auto;
        padding: var(--ui-space-xl) var(--ui-space-md);
        display: grid;
        gap: var(--ui-space-xl);
      }
      body > header h1 {
        font-size: var(--ui-text-4xl);
        font-weight: var(--ui-weight-bold);
        letter-spacing: var(--ui-tracking-tight);
        line-height: var(--ui-leading-tight);
      }
      body > header p {
        color: var(--ui-color-text-muted);
        max-width: 44rem;
        margin-block: var(--ui-space-xs) var(--ui-space-md);
      }
      code {
        font-family: var(--ui-font-code);
        font-size: var(--ui-text-xs);
      }
      .demo-screens {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 19rem), 1fr));
        gap: var(--ui-space-md);
      }
      body:has(#mode-dark:checked) .demo-screen {
        color-scheme: dark;
      }
      body:has(#mode-light:checked) .demo-screen {
        color-scheme: light;
      }
      figure {
        display: grid;
        gap: var(--ui-space-xs);
        align-content: start;
      }
      figcaption {
        font-size: var(--ui-text-sm);
        font-weight: var(--ui-weight-semibold);
      }
      figcaption span {
        color: var(--ui-color-text-muted);
        font-weight: var(--ui-weight-normal);
      }
      .demo-screen {
        display: grid;
        gap: var(--ui-space-md);
        align-content: start;
        padding: var(--ui-space-md);
        border: var(--ui-border-width) solid var(--ui-color-border-strong);
        border-radius: var(--ui-radius-lg);
        background: var(--ui-color-bg);
        color: var(--ui-color-text);
        font-family: var(--ui-font-body);
      }
      .demo-head {
        display: flex;
        align-items: center;
        gap: var(--ui-space-sm);
      }
      .demo-head h2 {
        font-family: var(--ui-font-heading);
        font-size: var(--ui-text-2xl);
        font-weight: var(--ui-weight-bold);
        letter-spacing: var(--ui-tracking-tight);
        line-height: var(--ui-leading-tight);
      }
      .demo-head p {
        color: var(--ui-color-text-muted);
        font-size: var(--ui-text-sm);
      }
      .demo-cards {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--ui-space-sm);
      }
      .demo-form {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--ui-space-sm);
      }
      .demo-row {
        display: flex;
        flex-wrap: wrap;
        gap: var(--ui-space-md);
      }
      .demo-screen .ui-toast {
        inline-size: auto;
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <!-- Demo icons, filled. Melui ships none: bring your own. -->
      <symbol id="i-fish" viewBox="0 0 24 24"><path d="M2 12c2.6-4.6 8.4-6.4 13.4-3.4L20 5v14l-4.6-3.6C10.4 18.4 4.6 16.6 2 12Zm6.5-1.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Z" /></symbol>
      <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M21 3C10 3 4 8 4 15.5c0 1.6.4 3 1 4.5 1-5 4.6-8.6 9.5-10-4 2.4-6.8 5.6-7.8 9.6C17.4 20.4 21 13 21 3Z" /></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><path d="M12 6.5a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11ZM11 1h2v3.5h-2zM11 19.5h2V23h-2zM1 11h3.5v2H1zM19.5 11H23v2h-3.5zM4.2 5.6l1.4-1.4 2.5 2.5-1.4 1.4zM15.9 17.3l1.4-1.4 2.5 2.5-1.4 1.4zM4.2 18.4l2.5-2.5 1.4 1.4-2.5 2.5zM15.9 6.7l2.5-2.5 1.4 1.4-2.5 2.5z" /></symbol>
      <symbol id="i-open" viewBox="0 0 24 24"><path d="M5 11h10.2l-4.6-4.6L12 5l7 7-7 7-1.4-1.4 4.6-4.6H5z" /></symbol>
      <symbol id="i-save" viewBox="0 0 24 24"><path d="M6 2h12a1 1 0 0 1 1 1v19l-7-4.5L5 22V3a1 1 0 0 1 1-1Z" /></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M3 17.3V21h3.7L17.8 9.9l-3.7-3.7zM20.7 7a1 1 0 0 0 0-1.4l-2.3-2.3a1 1 0 0 0-1.4 0l-1.8 1.8 3.7 3.7z" /></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><path d="M8 2h11a2 2 0 0 1 2 2v13h-2V4H8zM4 6h11a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1Z" /></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M9 2h6l1 2h5v2H3V4h5zM5 8h14l-1 13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1z" /></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><path d="M5 10a2 2 0 1 1 0 4 2 2 0 0 1 0-4Zm7 0a2 2 0 1 1 0 4 2 2 0 0 1 0-4Zm7 0a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z" /></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20Zm-1.4 13.6 6.7-6.7-1.4-1.4-5.3 5.3-2.6-2.6-1.4 1.4z" /></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 2 1 21h22zm-1 7h2v6h-2zm0 8h2v2h-2z" /></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20Zm-1 5v7h2V7zm0 9v2h2v-2z" /></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20Zm-1 8v8h2v-8zm0-4v2h2V6z" /></symbol>
      <symbol id="i-bold" viewBox="0 0 24 24"><path d="M7 4h6a4 4 0 0 1 2.7 7A4.5 4.5 0 0 1 13.5 20H7zm3 3v3.5h3a1.75 1.75 0 1 0 0-3.5zm0 6.5V17h3.5a1.75 1.75 0 1 0 0-3.5z" /></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M4 5h3v3H4zm5 0h11v3H9zM4 10.5h3v3H4zm5 0h11v3H9zM4 16h3v3H4zm5 0h11v3H9z" /></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><path d="M4 3h16a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Zm1 14h14l-4.5-6-3.5 4.5-2.5-3zM8.5 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z" /></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 5h18v2.5H3zm0 5.75h18v2.5H3zm0 5.75h18V19H3z" /></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20Zm-1.4 13.6 6.7-6.7-1.4-1.4-5.3 5.3-2.6-2.6-1.4 1.4z" /></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 2 1 21h22zm-1 7h2v6h-2zm0 8h2v2h-2z" /></symbol>
    </svg>


    <header>
      <h1>Themes</h1>
      <p>
        One pond tracker, four times. Only the theme changes: each is a single
        file that sets tokens (colour, type, shape, shadow and which material
        things are made of) and no component CSS. If two of them look like
        siblings, Melui's defaults are too strong.
      </p>
      <div class="ui-tabs" role="radiogroup" aria-label="Mode">
        <label class="ui-tab"><input type="radio" name="mode" id="mode-light" checked /><svg><use href="#i-sun" /></svg>Light</label>
        <label class="ui-tab"><input type="radio" name="mode" id="mode-dark" /><svg><use href="#i-menu" /></svg>Dark</label>
      </div>
    </header>

    <div class="demo-screens" data-screens></div>

    <template id="screen">
          <div class="ui-toolbar" role="toolbar" aria-label="Pond">
            <button class="ui-button ui-button-sm"><svg><use href="#i-fish" /></svg>Feed</button>
            <button class="ui-button ui-button-sm"><svg><use href="#i-edit" /></svg>Log</button>
            <span class="ui-toolbar-divider"></span>
            <button class="ui-button ui-button-sm ui-button-accent"><svg><use href="#i-save" /></svg>Save</button>
          </div>
          <header class="demo-head">
            <img class="ui-avatar ui-avatar-lg" alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='%23FCC560'/%3E%3Cpath d='M6 22c5-7 14-9 22-4l6-4v16l-6-4c-8 5-17 3-22-4z' fill='%23D53302'/%3E%3C/svg%3E" />
            <div>
              <h2>Koi pond</h2>
              <p>12 fish · 3 lilies <span class="ui-badge ui-badge-success"><svg><use href="#i-check" /></svg>Fed</span></p>
            </div>
          </header>
          <div class="ui-tabs" role="radiogroup" aria-label="View">
            <label class="ui-tab"><input type="radio" name="view" checked /><svg><use href="#i-fish" /></svg>Fish</label>
            <label class="ui-tab"><input type="radio" name="view" /><svg><use href="#i-leaf" /></svg>Plants</label>
            <label class="ui-tab"><input type="radio" name="view" /><svg><use href="#i-sun" /></svg>Water</label>
          </div>
          <div class="demo-cards">
            <article class="ui-card">
              <div class="ui-card-symbol"><svg><use href="#i-sun" /></svg></div>
              <h3 class="ui-card-title">18°C, clear</h3>
              <p class="ui-card-text">Filter at 70%.</p>
              <progress class="ui-progress" value="70" max="100">70%</progress>
            </article>
            <article class="ui-card">
              <div class="ui-card-symbol"><svg><use href="#i-fish" /></svg></div>
              <h3 class="ui-card-title">Next feed 18:00</h3>
              <p class="ui-card-text">Pellets, one scoop.</p>
              <div class="ui-card-actions"><button class="ui-button ui-button-sm"><svg><use href="#i-open" /></svg>Plan</button></div>
            </article>
          </div>
          <ul class="ui-list">
            <li><a class="ui-list-item" href="#" aria-current="page">
              <img class="ui-list-symbol ui-avatar" alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='%23FCC560'/%3E%3Cpath d='M6 22c5-7 14-9 22-4l6-4v16l-6-4c-8 5-17 3-22-4z' fill='%23D53302'/%3E%3C/svg%3E" />
              <span class="ui-list-title">Kohaku</span>
              <span class="ui-list-text">Fed 4 hours ago</span>
            </a></li>
            <li><a class="ui-list-item" href="#">
              <img class="ui-list-symbol ui-avatar" alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='%238FB1BE'/%3E%3Cpath d='M6 22c5-7 14-9 22-4l6-4v16l-6-4c-8 5-17 3-22-4z' fill='%23FFFFFF'/%3E%3C/svg%3E" />
              <span class="ui-list-title">Shusui</span>
              <span class="ui-list-text">Hiding under the lilies</span>
            </a></li>
          </ul>
          <div class="ui-notice ui-notice-warning" role="status">
            <svg class="ui-notice-symbol"><use href="#i-alert" /></svg>
            <p class="ui-notice-title">Water is low</p>
            <p class="ui-notice-text">Top up before the weekend.</p>
          </div>
          <div class="demo-form">
            <div class="ui-field">
              <label class="ui-field-label">Note</label>
              <input class="ui-input" placeholder="Anything to remember" />
            </div>
            <div class="ui-field">
              <label class="ui-field-label">Food</label>
              <div class="ui-select"><select><option>Pellets</option><option>Flakes</option></select></div>
            </div>
          </div>
          <div class="demo-row">
            <label class="ui-choice"><input type="checkbox" role="switch" checked />Pump</label>
            <label class="ui-choice"><input type="checkbox" checked />Remind me</label>
          </div>
          <div class="ui-toast ui-toast-success">
            <svg class="ui-toast-symbol"><use href="#i-check" /></svg>
            <p class="ui-toast-title">Feeding logged</p>
            <p class="ui-toast-text">12:04, Kohaku and friends.</p>
          </div>
    </template>

    <script>
      // Demo only: the same screen once per theme.
      const themes = [
        ["", "Default", "neutral, solid, system font"],
        ["japan-fish", "Japan Fish", "washi paper, indigo, Shippori Mincho"],
        ["mono", "Mono", "black and white, square, IBM Plex Mono"],
        ["loud", "Loud", "hot magenta, glass, Archivo"],
      ];
      const host = document.querySelector("[data-screens]");
      for (const [id, name, note] of themes) {
        const fig = document.createElement("figure");
        fig.innerHTML = `<figcaption>${name} <span>${note}</span></figcaption>`;
        const screen = document.createElement("div");
        screen.className = "demo-screen";
        // "default" resets to Melui's own tokens, even inside a themed page.
        screen.dataset.uiTheme = id || "default";
        const content = document.getElementById("screen").content.cloneNode(true);
        for (const el of content.querySelectorAll("[name]")) el.name += "-" + (id || "default");
        screen.append(content);
        fig.append(screen);
        host.append(fig);
      }
    </script>
  </body>
</html>
